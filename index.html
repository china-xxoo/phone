<script>
// ======================================
// 你的配置（已填好，不用动）
// ======================================
const GIST_ID = "4e70e9fa9c35ddaf46228b11b41d28c9";
const GITHUB_TOKEN = "github_pat_11CCEQIOY0BPvD8XeTNo4b_IRFT4Poouv2nd5ZAL7NjRohFrdwP55yr9F2NYVeETTy1XAU7XIBJnS8";
const FILENAME = "data.json";

let mgmtData = {};
let phoneOrder = [];

// ======================================
// 从云端同步
// ======================================
async function loadFromGist() {
  try {
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      headers: { Authorization: `token ${GITHUB_TOKEN}` }
    });
    const gist = await res.json();
    const content = JSON.parse(gist.files[FILENAME].content);

    mgmtData = content.mgmtData || {};
    phoneOrder = content.phoneOrder || Object.keys(mgmtData).sort();

    saveToLocal();
    renderMgmtGrid();
    updateSummary();
    alert("✅ 从云端同步成功！");
  } catch (e) {
    loadFromLocal();
    alert("⚠️ 云端同步失败，使用本地数据");
  }
}

// ======================================
// 保存到云端
// ======================================
async function saveToGist() {
  try {
    const data = { mgmtData, phoneOrder };
    await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method: "PATCH",
      headers: {
        Authorization: `token ${GITHUB_TOKEN}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        files: {
          [FILENAME]: { content: JSON.stringify(data, null, 2) }
        }
      })
    });
    saveToLocal();
    renderMgmtGrid();
    updateSummary();
    alert("✅ 已保存到云端！");
  } catch (e) {
    alert("❌ 保存到云端失败");
  }
}

// ======================================
// 本地存储
// ======================================
function saveToLocal() {
  localStorage.setItem("mgmtData", JSON.stringify(mgmtData));
  localStorage.setItem("phoneOrder", JSON.stringify(phoneOrder));
}

function loadFromLocal() {
  mgmtData = JSON.parse(localStorage.getItem("mgmtData") || "{}");
  phoneOrder = JSON.parse(localStorage.getItem("phoneOrder") || "[]");
  renderMgmtGrid();
  updateSummary();
}

// ======================================
// 登录成功后，显示同步按钮
// ======================================
function showSyncButtons() {
  const btnArea = document.getElementById("syncButtons");
  if (btnArea) btnArea.style.display = "block";
}
</script>

<!-- 同步按钮（默认隐藏，登录后才显示） -->
<div id="syncButtons" style="display:none; margin:10px 0;">
  <button onclick="saveToGist()" style="padding:8px 14px; margin-right:6px;">💾 保存到云端</button>
  <button onclick="loadFromGist()" style="padding:8px 14px;">🔄 从云端同步</button>
</div>

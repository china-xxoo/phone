<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>号码管理</title>
<style>
  body{background:#f0f2f5;margin:0;padding:15px;font-family:Arial}
  .login{background:#fff;padding:20px;border-radius:10px;max-width:400px;margin:0 auto}
  .main{background:#fff;padding:15px;border-radius:10px;max-width:400px;margin:0 auto;display:none}
  .title{text-align:center;margin-bottom:15px}
  input,button{padding:8px;margin:5px 0;width:100%;box-sizing:border-box}
  .info{background:#f8f9fa;padding:10px;border-radius:5px;margin-bottom:10px}
  .btn-line{display:flex;gap:5px;margin:10px 0}
  .btn-line button{flex:1;margin:0}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="title">登录</div>
  <input type="password" id="pwd" placeholder="密码">
  <button onclick="login()">登录</button>
</div>

<div class="main" id="main">
  <div class="title">号码管理</div>
  <div class="info" id="info">
    总数：0<br>
    状态：正常
  </div>

  <div class="btn-line">
    <button onclick="upload()">上传备份</button>
    <button onclick="download()">下载资料</button>
    <button onclick="location.reload()">刷新</button>
  </div>

  <input type="text" id="phone" placeholder="输入手机号">
  <button onclick="add()">添加</button>
  <div id="list"></div>
</div>

<script>
// 配置
const TOKEN = "github_pat_11CCEQIOY0BPvD8XeE9lkc_0qHk0Lg7Vn1VnH0zJzJzJzJzJzJzJzJz";
const GISTID = "4e70e9fa9c35ddaf46228b11b41d28c9";

// 登录
function login(){
  let p = document.getElementById("pwd").value;
  if(p === "123456"){
    document.getElementById("login").style.display="none";
    document.getElementById("main").style.display="block";
    loadData();
  }
}

// 读取本地
function loadData(){
  let d = JSON.parse(localStorage.getItem("data")||"[]");
  render(d);
}

// 保存本地
function save(d){
  localStorage.setItem("data",JSON.stringify(d));
  render(d);
}

// 渲染
function render(d){
  let list = document.getElementById("list");
  let info = document.getElementById("info");
  info.innerHTML = `总数：${d.length}<br>状态：正常`;
  list.innerHTML = d.map(i=>`<div>${i}</div>`).join("");
}

// 添加
function add(){
  let v = document.getElementById("phone").value.trim();
  if(!v)return;
  let d = JSON.parse(localStorage.getItem("data")||"[]");
  d.push(v);
  save(d);
  document.getElementById("phone").value="";
}

// 上传
async function upload(){
  let d = localStorage.getItem("data")||"[]";
  await fetch(`https://api.github.com/gists/${GISTID}`,{
    method:"PATCH",
    headers:{Authorization:`token ${TOKEN}`,"Content-Type":"application/json"},
    body:JSON.stringify({files:{"data.json":{content:d}}})
  });
  alert("上传成功");
}

// 下载（修复：带权限）
async function download(){
  try{
    let res = await fetch(`https://api.github.com/gists/${GISTID}`,{
      headers:{Authorization:`token ${TOKEN}`}
    });
    let gist = await res.json();
    let content = gist.files["data.json"].content;
    localStorage.setItem("data",content);
    loadData();
    alert("下载成功");
  }catch(e){
    alert("下载失败");
  }
}
</script>
</body>
</html>

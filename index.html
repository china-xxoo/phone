<script>
// ======================================
// 你的配置信息（已填好，无需修改）
// ======================================
const GIST_ID = "4e70e9fa9c35ddaf46228b11b41d28c9";
const GITHUB_TOKEN = "github_pat_11CCEQIOY0BPvD8XeTNo4b_IRFT4Poouv2nd5ZAL7NjRohFrdwP55yr9F2NYVeETTy1XAU7XIBJnS8";
const FILENAME = "data.json";

// 你的数据变量（和你原来的保持一致）
let mgmtData = {};
let phoneOrder = [];

// ======================================
// 从云端 Gist 加载数据
// ======================================
async function loadFromGist() {
  try {
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      headers: { Authorization: `token ${GITHUB_TOKEN}` }
    });
    const gist = await res.json();
    const content = JSON.parse(gist.files[FILENAME].content);

    mgmtData = content.mgmtData || {};
    phoneOrder = content.phoneOrder || Object.keys(mgmtData).sort();

    saveToLocal(); // 同时保存到本地，防止云端失败
    if (typeof renderMgmtGrid === 'function') renderMgmtGrid();
    if (typeof updateSummary === 'function') updateSummary();
    alert("✅ 从云端同步成功！");
  } catch (e) {
    console.error("云端同步失败:", e);
    loadFromLocal(); // 降级到本地数据
    alert("⚠️ 云端同步失败，已加载本地数据");
  }
}

// ======================================
// 保存数据到云端 Gist
// ======================================
async function saveToGist() {
  try {
    const data = { mgmtData, phoneOrder };
    await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method: "PATCH",
      headers: {
        Authorization: `token ${GITHUB_TOKEN}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        files: {
          [FILENAME]: { content: JSON.stringify(data, null, 2) }
        }
      })
    });
    saveToLocal();
    alert("✅ 已保存到云端！");
  } catch (e) {
    console.error("保存到云端失败:", e);
    alert("❌ 保存到云端失败");
  }
}

// ======================================
// 本地存储（备用方案）
// ======================================
function saveToLocal() {
  localStorage.setItem("mgmtData", JSON.stringify(mgmtData));
  localStorage.setItem("phoneOrder", JSON.stringify(phoneOrder));
}

function loadFromLocal() {
  mgmtData = JSON.parse(localStorage.getItem("mgmtData") || "{}");
  phoneOrder = JSON.parse(localStorage.getItem("phoneOrder") || "[]");
  if (typeof renderMgmtGrid === 'function') renderMgmtGrid();
  if (typeof updateSummary === 'function') updateSummary();
}

// ======================================
// 页面加载时自动从云端同步
// ======================================
window.addEventListener('load', loadFromGist);
</script>

<!-- 页面上添加两个同步按钮 -->
<div style="margin: 10px 0;">
  <button onclick="saveToGist()" style="padding: 8px 16px; margin-right: 8px;">💾 保存到云端</button>
  <button onclick="loadFromGist()" style="padding: 8px 16px;">🔄 从云端同步</button>
</div>
